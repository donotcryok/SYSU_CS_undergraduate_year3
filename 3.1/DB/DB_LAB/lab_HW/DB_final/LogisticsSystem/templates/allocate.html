{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-box-seam"></i> 运单分配</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('allocate') }}">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="weight" class="form-label">货物重量 (kg)</label>
                            <input type="number" step="0.01" class="form-control" id="weight" name="weight" required placeholder="例如: 500.5">
                        </div>
                        <div class="col-md-6">
                            <label for="volume" class="form-label">货物体积 (m³)</label>
                            <input type="number" step="0.01" class="form-control" id="volume" name="volume" required placeholder="例如: 12.5">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="destination" class="form-label">目的地</label>
                        <input type="text" class="form-control" id="destination" name="destination" required placeholder="请输入详细地址">
                    </div>

                    <div class="mb-4">
                        <label for="vehicle_id" class="form-label">选择空闲车辆</label>
                        <select class="form-select" id="vehicle_id" name="vehicle_id" required>
                            <option value="" selected disabled>-- 请选择车辆 --</option>
                            {% for vehicle in vehicles %}
                                <option value="{{ vehicle.VehicleID }}">{{ vehicle.PlateNumber }} (ID: {{ vehicle.VehicleID }})</option>
                            {% else %}
                                <option value="" disabled>暂无空闲车辆</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">仅显示当前状态为“空闲”的车辆。</div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle"></i> 确认分配
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
