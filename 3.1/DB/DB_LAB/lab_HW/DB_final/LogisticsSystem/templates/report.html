{% extends "layout.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-table"></i> 每周异常统计报表</h4>
        <span class="badge bg-light text-dark">View_WeeklyAbnormalities</span>
    </div>
    <div class="card-body">
        {% if rows %}
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered align-middle">
                    <thead class="table-dark">
                        <tr>
                            {% for col in columns %}
                                <th scope="col">{{ col }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in rows %}
                            <tr>
                                {% for cell in row %}
                                    <td>{{ cell }}</td>
                                {% endfor %}
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        {% else %}
            <div class="text-center py-5">
                <i class="bi bi-clipboard-check display-1 text-muted"></i>
                <h3 class="mt-3 text-muted">暂无异常数据</h3>
                <p>本周运行状况良好，未发现异常记录。</p>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
