{% extends 'books/base.html' %}

{% block content %}
<div style="background-color: #fff3cd; padding: 20px; border: 1px solid #ffeeba; color: #856404;">
    <h2>⚠️ 危险操作</h2>
    <p>你确定要删除图书 <strong>{{ book.book_name }}</strong> (ID: {{ book.book_id }}) 吗？</p>
    <p>此操作无法撤销。</p>
</div>

<form method="post" style="margin-top: 20px;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">确认删除</button>
    <a href="{% url 'book_list' %}" class="btn" style="background-color: #95a5a6;">取消</a>
</form>
{% endblock %}
